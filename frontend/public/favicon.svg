<!--
  Favicon del sitio: la "s" de santiago en serif cursiva, la misma
  tipografía de los títulos, sobre el charcoal de la paleta.
  En SVG para que se vea nítida en cualquier tamaño de pestaña.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#2b2b2b" />
  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="42"
    fill="#e0e0e0"
  >s</text>
</svg>
