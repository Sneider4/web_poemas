<header class="mb-4">
  <h1 class="fs-3 mb-0">Autor</h1>
  <p class="small text-body-secondary mb-0">
    Tu nombre, tu biografía y tu foto, tal como se ven en la página "Autor".
  </p>
</header>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="row g-4">
    <div class="col-12 col-xl-7">
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
    <input
      id="nombre"
      class="form-control"
      [class.is-invalid]="formulario.controls.name.touched && formulario.controls.name.invalid"
      type="text"
      formControlName="name"
          maxlength="80"
        />
        <div class="invalid-feedback">El nombre es obligatorio.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="lema">Frase del sitio</label>
        <input
          id="lema"
          class="form-control"
          type="text"
          formControlName="tagline"
          maxlength="200"
          placeholder="Poemas de un solitario para otro solitario"
        />
        <div class="form-text">Se muestra debajo de tu nombre en la página de autor.</div>
      </div>

      <app-rich-text
        formControlName="bio"
        etiqueta="Tu biografía"
        alto="22rem"
        claseTexto="texto-poema"
        placeholder="Contá quién sos y qué escribís..."
        ayuda="Podés usar negrita, cursiva, listas y enlaces. Los saltos de línea se respetan."
      />
    </div>

    <div class="col-12 col-xl-5">
      <div class="mb-4">
        <label class="form-label" for="instagram">Usuario de Instagram</label>
        <div class="input-group">
          <span class="input-group-text">&#64;</span>
          <input
            id="instagram"
            class="form-control"
            type="text"
            formControlName="instagram"
            maxlength="100"
            placeholder="santiago_a_secas__"
          />
        </div>
        <div class="form-text">Sin la arroba.</div>
      </div>

      <app-image-upload
        [(valor)]="retrato"
        categoria="autor"
        etiqueta="Tu foto"
        forma="vertical"
        ayuda="Vertical, tipo retrato: 600 × 800 px o más (proporción 3:4). Se muestra al costado
               de tu biografía. JPG, PNG o WebP, hasta 5 MB. Si no subís ninguna, aparece un marco
               con tu inicial."
      />
    </div>
  </div>

  <div class="d-flex justify-content-end mt-3">
    <button type="submit" class="btn btn-primary" [disabled]="guardando() || cargando()">
      @if (guardando()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      }
      {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
    </button>
  </div>
</form>
