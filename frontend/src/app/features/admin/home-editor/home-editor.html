<header class="mb-4">
  <h1 class="fs-3 mb-0">Página principal</h1>
  <p class="small text-body-secondary mb-0">
    Lo que ve alguien al entrar al sitio: la imagen de fondo, el verso grande y la frase
    de la segunda sección.
  </p>
</header>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="row g-4">
    <div class="col-12 col-xl-6">
      <h2 class="fs-5 border-bottom pb-2 mb-3">Portada</h2>

      <app-image-upload
        [(valor)]="fondoPortada"
        categoria="portada"
        etiqueta="Imagen de fondo"
        forma="ancha"
        ayuda="Horizontal y bien grande: 1920 × 1080 px o más, porque ocupa toda la pantalla al
               entrar. Encima va el verso en letra grande sobre un velo oscuro, así que funcionan
               mejor las fotos con espacio libre en el centro y sin mucho detalle. JPG, PNG o
               WebP, hasta 5 MB."
      />

      <div class="mb-3">
        <label class="form-label" for="antetitulo">Antetítulo</label>
        <input
          id="antetitulo"
          class="form-control"
          type="text"
          formControlName="heroEyebrow"
          maxlength="120"
          placeholder="Santiago a secas"
        />
        <div class="form-text">La línea pequeña arriba del verso grande.</div>
      </div>

      <app-rich-text
        formControlName="heroVerse"
        etiqueta="Verso de portada"
        alto="6rem"
        claseTexto="texto-poema"
        placeholder="Dejalo vacío para usar los versos del poema destacado"
        ayuda="Si lo dejás vacío, la portada muestra sola los primeros versos del poema
               marcado como Destacado. Escribí acá solo si querés fijar otro texto."
      />
    </div>

    <div class="col-12 col-xl-6">
      <h2 class="fs-5 border-bottom pb-2 mb-3">Segunda sección</h2>

      <app-rich-text
        formControlName="manifesto"
        etiqueta="Frase"
        alto="6rem"
        claseTexto="texto-poema"
        placeholder="La frase que te representa..."
        ayuda="La frase grande que aparece al bajar desde la portada."
      />

      <app-rich-text
        formControlName="manifestoNote"
        etiqueta="Texto debajo de la frase"
        alto="9rem"
        placeholder="Un párrafo que acompañe a la frase..."
        ayuda="Si lo dejás vacío, no se muestra nada debajo de la frase."
      />
    </div>
  </div>

  <div class="d-flex justify-content-end mt-3">
    <button type="submit" class="btn btn-primary" [disabled]="guardando() || cargando()">
      @if (guardando()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      }
      {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
    </button>
  </div>
</form>
