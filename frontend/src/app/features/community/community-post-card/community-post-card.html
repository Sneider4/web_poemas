<article class="card h-100" [class.opacity-50]="post().hidden">
  <div class="card-body d-flex flex-column gap-3">
    <div class="d-flex align-items-center justify-content-between gap-2">
      <span class="badge rounded-pill bg-body-secondary text-body-secondary text-uppercase">
        {{ etiquetaTipo() }}
      </span>
      <time class="small text-body-tertiary" [attr.datetime]="post().createdAt">
        {{ post().createdAt | date: 'd MMM' }}
      </time>
    </div>

    <!-- Contenido de un visitante: el backend ya lo limpió con lista blanca
         y Angular vuelve a sanitizarlo al insertarlo. -->
    <div class="texto-poema flex-grow-1" [innerHTML]="post().content"></div>

    <div class="d-flex align-items-center justify-content-between gap-2 pt-3 border-top">
      <span class="small text-body-secondary text-break">{{ post().authorName }}</span>

      <button
        type="button"
        class="btn btn-sm rounded-pill"
        [class]="yaCalifico() ? 'btn-primary' : 'btn-outline-secondary'"
        [attr.aria-pressed]="yaCalifico()"
        [attr.aria-label]="yaCalifico() ? 'Quitar me gusta' : 'Me gusta'"
        [title]="yaCalifico() ? 'Quitar me gusta' : 'Me gusta'"
        (click)="alCalificar()"
      >
        <!-- Corazón lleno si ya le diste me gusta, vacío si no. Van como
             caracteres y no como entidad porque la interpolación las escapa. -->
        <span aria-hidden="true">{{ yaCalifico() ? '♥' : '♡' }}</span>
        {{ post().ratingCount }}
      </button>
    </div>
  </div>
</article>
