<div class="mb-4">
  <label class="form-label" [attr.for]="idCampo">{{ etiqueta() }}</label>

  <div class="d-flex flex-wrap align-items-start gap-3">
    <div
      class="vista-previa fondo-foto"
      [class.vista-previa--vertical]="forma() === 'vertical'"
      [style.background-image]="fondoVistaPrevia()"
    >
      @if (subiendo()) {
        <div class="vista-previa__capa">
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        </div>
      } @else if (!valor()) {
        <span class="vista-previa__vacia">sin imagen</span>
      }
    </div>

    <div class="flex-grow-1" style="min-width: 15rem">
      <input
        [id]="idCampo"
        class="form-control"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        [disabled]="subiendo()"
        (change)="alElegirArchivo($event)"
      />

      @if (valor()) {
        <button type="button" class="btn btn-link btn-sm text-danger p-0 mt-2" (click)="quitar()">
          Quitar imagen
        </button>
      }

      @if (error()) {
        <div class="text-danger small mt-2" role="alert">{{ error() }}</div>
      }

      @if (ayuda()) {
        <div class="form-text mt-2">{{ ayuda() }}</div>
      }
    </div>
  </div>
</div>
